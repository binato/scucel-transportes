services:
  # ─── Banco de Dados PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scucel_db}
      POSTGRES_USER: ${POSTGRES_USER:-scucel_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scucel_password_2026}
    volumes:
      - scucel_pgdata:/var/lib/postgresql/data
    # Porta NÃO exposta externamente — acesso apenas via rede interna
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scucel_user} -d ${POSTGRES_DB:-scucel_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scucel_net

  # ─── Backend FastAPI (Python 3.11) ────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-scucel_user}:${POSTGRES_PASSWORD:-scucel_password_2026}@postgres:5432/${POSTGRES_DB:-scucel_db}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - scucel_uploads:/app/uploads
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - scucel_net

  # ─── Frontend React + Nginx ───────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # URL pública da API — defina via variável de ambiente no Easypanel
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - scucel_net

# ─── Volumes Persistentes ──────────────────────────────────────────────────
volumes:
  scucel_pgdata:
  scucel_uploads:

# ─── Rede Interna (sem acesso externo direto) ─────────────────────────────
networks:
  scucel_net:
    driver: bridge
